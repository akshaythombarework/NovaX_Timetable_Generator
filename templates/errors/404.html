{% extends "base.html" %}

{% block title %}Page Not Found - NovaX{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="display-1 fw-bold text-primary mb-3">404</div>
    <h3 class="fw-bold mb-2">Page Not Found</h3>
    <p class="text-muted mb-4">The requested timetable view or endpoint does not exist.</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary-glow">
        <i class="fa-solid fa-house me-2"></i> Return to Portal Home
    </a>
</div>
{% endblock %}
